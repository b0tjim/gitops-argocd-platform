# Keep at least one API pod running during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bakery-orders-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bakery-orders-api
      app.kubernetes.io/instance: bakery-orders-api
      app.kubernetes.io/component: api
