# Dev environment: one replica in its own namespace, with debug logging.
# Render with `kustomize build --enable-helm workloads/bakery-orders-api/overlays/dev`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bakery-dev

resources:
  - namespace.yaml
  - ../../base
  # DB credentials, encrypted for this namespace (scripts/seal-db-secret.sh).
  - postgresql-sealedsecret.yaml

# The image tag this environment runs. Promotion = a PR that changes newTag
# (see docs/promotion.md).
images:
  - name: ghcr.io/b0tjim/bakery-orders-api
    newTag: "0.1.0"

replicas:
  - name: bakery-orders-api
    count: 1

patches:
  # Drop the chart's plain Secret; the controller creates it from the SealedSecret.
  - target:
      kind: Secret
      name: bakery-orders-api-postgresql
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: bakery-orders-api-postgresql
  # The image runs the uvicorn CLI, which reads UVICORN_* env vars as flags.
  - target:
      kind: Deployment
      name: bakery-orders-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: UVICORN_LOG_LEVEL
          value: debug
