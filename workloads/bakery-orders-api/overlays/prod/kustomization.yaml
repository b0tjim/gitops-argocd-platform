# Prod environment: two replicas with explicit resource limits and a
# PodDisruptionBudget, in its own namespace.
# Render with `kustomize build --enable-helm workloads/bakery-orders-api/overlays/prod`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bakery-prod

resources:
  - namespace.yaml
  - ../../base
  # DB credentials, encrypted for this namespace (scripts/seal-db-secret.sh).
  - postgresql-sealedsecret.yaml
  - pdb.yaml

# The image tag this environment runs. Promotion = a PR that changes newTag
# (see docs/promotion.md).
images:
  - name: ghcr.io/b0tjim/bakery-orders-api
    newTag: "0.1.0"

replicas:
  - name: bakery-orders-api
    count: 2

patches:
  # Drop the chart's plain Secret; the controller creates it from the SealedSecret.
  - target:
      kind: Secret
      name: bakery-orders-api-postgresql
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: bakery-orders-api-postgresql
  # Replace the chart's default resources with prod-sized requests and limits.
  - target:
      kind: Deployment
      name: bakery-orders-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
