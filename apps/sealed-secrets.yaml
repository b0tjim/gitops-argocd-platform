# Sealed Secrets controller: decrypts SealedSecret resources committed to git
# into ordinary Secrets inside the cluster. Installed from the upstream Helm
# chart at a pinned version; bump targetRevision to upgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: bakery
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.17.2
    helm:
      valuesObject:
        # kubeseal looks for a controller with this name in kube-system by default
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
